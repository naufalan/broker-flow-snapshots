name: Refresh broker-flow snapshots

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "Optional market date (YYYY-MM-DD); blank uses today's WIB date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: broker-flow-snapshot-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_BASE_URL: https://broker-monitor-poc.pemudatersesat.workers.dev
      BATCH_COUNT: "3"
      SNAPSHOT_DIR: snapshots/latest
      TZ: Asia/Jakarta

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate all batches
        id: snapshot
        shell: bash
        run: |
          set -Eeuo pipefail

          requested_date="${{ github.event.inputs.market_date || '' }}"
          market_date="${requested_date:-$(date +%F)}"

          if [[ ! "$market_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid market_date: $market_date" >&2
            exit 1
          fi

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          for batch in $(seq 1 "$BATCH_COUNT"); do
            output="$work_dir/batch-$batch.json"
            url="$WORKER_BASE_URL/api/v1/report?batch=$batch&batch_count=$BATCH_COUNT&refresh=1&date=$market_date"

            echo "Fetching batch $batch/$BATCH_COUNT for $market_date"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 180 \
              "$url" --output "$output"

            jq -e \
              --arg expected_date "$market_date" \
              --argjson expected_batch "$batch" \
              --argjson expected_count "$BATCH_COUNT" '
                .schema_version == "broker-monitor.report.v3" and
                .market_date == $expected_date and
                .batching.batch == $expected_batch and
                .batching.batch_count == $expected_count and
                (.tickers | type) == "array" and
                .ticker_count == (.tickers | length) and
                all(.tickers[]; ((.ticker | type) == "string" and (.ticker | length) > 0))
              ' "$output" >/dev/null
          done

          jq -s -e '
            [.[].tickers[].ticker] as $codes |
            ($codes | length) == ($codes | unique | length)
          ' "$work_dir"/batch-*.json >/dev/null

          ticker_count="$(jq -s '[.[].tickers[]] | length' "$work_dir"/batch-*.json)"
          pending_count="$(jq -s '[.[].tickers[] | select(.today_data_status.status == "PENDING_BROKER_RELEASE")] | length' "$work_dir"/batch-*.json)"
          fetched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "$pending_count" -gt 0 ]]; then
            snapshot_status="PENDING_BROKER_RELEASE"
          else
            snapshot_status="READY"
          fi

          mkdir -p "$SNAPSHOT_DIR"
          for batch in $(seq 1 "$BATCH_COUNT"); do
            cp "$work_dir/batch-$batch.json" "$SNAPSHOT_DIR/batch-$batch.json"
          done

          jq -n \
            --arg schema_version "broker-monitor.snapshot-manifest.v1" \
            --arg status "$snapshot_status" \
            --arg fetched_at "$fetched_at" \
            --arg market_date "$market_date" \
            --arg source "$WORKER_BASE_URL" \
            --argjson batch_count "$BATCH_COUNT" \
            --argjson ticker_count "$ticker_count" \
            --argjson pending_ticker_count "$pending_count" '
              {
                schema_version: $schema_version,
                status: $status,
                fetched_at: $fetched_at,
                market_date: $market_date,
                source: $source,
                batch_count: $batch_count,
                ticker_count: $ticker_count,
                pending_ticker_count: $pending_ticker_count,
                files: ["batch-1.json", "batch-2.json", "batch-3.json"]
              }
            ' > "$SNAPSHOT_DIR/manifest.json"

          echo "market_date=$market_date" >> "$GITHUB_OUTPUT"
          echo "snapshot_status=$snapshot_status" >> "$GITHUB_OUTPUT"
          echo "ticker_count=$ticker_count" >> "$GITHUB_OUTPUT"
          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/latest/

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git commit -m "broker-flow: ${{ steps.snapshot.outputs.market_date }} (${{ steps.snapshot.outputs.snapshot_status }})"
          git push

      - name: Write run summary
        shell: bash
        run: |
          {
            echo "## Broker-flow snapshot"
            echo "- Market date: ${{ steps.snapshot.outputs.market_date }}"
            echo "- Status: ${{ steps.snapshot.outputs.snapshot_status }}"
            echo "- Tickers: ${{ steps.snapshot.outputs.ticker_count }}"
            echo "- Pending today data: ${{ steps.snapshot.outputs.pending_count }}"
          } >> "$GITHUB_STEP_SUMMARY"
